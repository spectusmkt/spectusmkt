  <style>
    :root {
      --bg: #121d3f; --navy: #142044; --card: #1a2750; --line: rgba(170,194,255,.16);
      --text: #f4f7ff; --muted: #b7c3e6; --dim: #8796c2; --accent: #a9c1ff; --wa: #25d366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font: 500 16px/1.5 Manrope, system-ui, sans-serif;
      background-image: radial-gradient(90% 50% at 50% 0%, rgba(124,141,184,.28), transparent 70%);
      background-repeat: no-repeat;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    .wrap { width: 100%; max-width: 460px; margin: 0 auto; padding: 48px 16px 40px; display: grid; gap: 14px; }

    /* Topo: foto + marca */
    .top { text-align: center; display: grid; justify-items: center; gap: 12px; margin-bottom: 14px; }
    .logo { height: 44px; width: auto; margin-top: 28px; }
    .tagline { color: var(--muted); font-size: 15px; max-width: 340px; }

    /* Banners */
    .label { font: 600 12px/1 Manrope, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); text-align: center; margin-top: 6px; }
    .banner {
      position: relative; display: grid; gap: 14px; padding: 18px 18px 16px; border-radius: 20px; overflow: hidden;
      border: 1px solid var(--line); background: linear-gradient(160deg, #22306a 0%, #18234d 60%, #142044 100%);
      transition: transform .2s ease, border-color .2s ease;
    }
    .banner:hover, .banner:focus-visible { transform: translateY(-2px); border-color: rgba(170,194,255,.45); }
    .banner:active { transform: scale(.99); }
    .banner--info { background: linear-gradient(160deg, #a9c1ff 0%, #8eaaf7 55%, #7393ee 100%); color: #101f42; border-color: transparent; }
    .banner__tag { justify-self: start; font: 700 11px/1 Manrope, sans-serif; letter-spacing: .12em; text-transform: uppercase;
      padding: 7px 10px; border-radius: 99px; background: rgba(170,194,255,.14); color: var(--accent); }
    .banner--info .banner__tag { background: rgba(16,31,66,.12); color: #101f42; }
    .banner h2 { font: 600 21px/1.2 Poppins, sans-serif; letter-spacing: -.01em; }
    .banner p { font-size: 14px; color: var(--muted); margin-top: 2px; }
    .banner--info p { color: #22336a; }
    .banner__foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .faces { display: flex; align-items: center; }
    .faces img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: #fff; border: 2px solid #18234d; margin-left: -10px; }
    .faces img:first-child { margin-left: 0; }
    .banner--info .faces img { border-color: #8eaaf7; }
    .faces span { font-size: 13px; font-weight: 600; margin-left: 10px; color: var(--muted); }
    .banner--info .faces span { color: #22336a; }
    .go { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
      background: var(--accent); color: #101f42; font-size: 20px; font-weight: 700; }
    .banner--info .go { background: #101f42; color: #a9c1ff; }

    /* WhatsApp */
    .wa {
      display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px 20px; border-radius: 18px;
      background: var(--wa); color: #052e16; font: 700 17px/1.2 Manrope, sans-serif; margin-top: 4px;
      box-shadow: 0 16px 34px -16px rgba(37,211,102,.6); transition: transform .2s ease;
    }
    .wa:hover { transform: translateY(-2px); }
    .wa svg { width: 22px; height: 22px; }
    .wa small { display: block; font-weight: 600; font-size: 12px; opacity: .75; }

    .foot { text-align: center; color: var(--dim); font-size: 13px; margin-top: 10px; display: grid; gap: 6px; }
    .foot a { color: var(--muted); font-weight: 600; }
    .foot a:hover { color: var(--accent); }
  </style>

  <script>
    const track = (type, ev, params) => { try { window.fbq && fbq(type, ev, params); } catch (e) {} };
    document.querySelectorAll(".js-bio").forEach((a) =>
